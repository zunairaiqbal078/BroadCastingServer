# CastPanel - local development stack (panel UI + database only)
#
# Streaming services (SHOUTcast, Icecast, Liquidsoap, castpanel-ctl daemon)
# are NOT included here. Those need a real Linux server or VM (install.sh).
#
#   cd dev && docker compose up -d --build
#   open http://localhost:8080     login: admin / password  (clients: demo1, demo2 / demo123)
#   DJ Control Center: http://localhost:2080   (dj1 / djpass1 after creating it)

services:
  web:
    build: .
    ports:
      - "8080:80"
      - "2080:2080"   # DJ Control Center, set up by the same script used on servers
    command: ["bash", "-c", "bash /var/www/castpanel/install/setup_dj_port.sh /var/www/castpanel localhost && exec apache2-foreground"]
    volumes:
      - ..:/var/www/html
      # Local config is mounted over the placeholder config, so the
      # client's config/database.php stays untouched.
      - ./database.local.php:/var/www/html/config/database.php:ro
      # Some pages (DJ portal) hardcode the production path /var/www/castpanel
      - ..:/var/www/castpanel
      - ./database.local.php:/var/www/castpanel/config/database.php:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: castpanel
      MARIADB_USER: castpanel
      MARIADB_PASSWORD: castpanel
    ports:
      - "3307:3306"
    volumes:
      - ../install/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

volumes:
  dbdata:
