<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radio Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e1b2e 0%, #2d1f5e 50%, #1e1b2e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .player-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }
        .player-card {
            background: rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .cover-art {
            width: 200px;
            height: 200px;
            border-radius: 16px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #6c3ce0, #9b59b6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            box-shadow: 0 10px 30px rgba(108,60,224,0.3);
            overflow: hidden;
        }
        .cover-art img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .station-name {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .now-playing {
            font-size: 14px;
            color: rgba(255,255,255,0.7);
            margin-bottom: 5px;
            min-height: 20px;
        }
        .artist {
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            margin-bottom: 20px;
        }
        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            margin-bottom: 15px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #666;
        }
        .status-dot.online {
            background: #2ecc71;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }
        .play-btn {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #6c3ce0;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            box-shadow: 0 4px 15px rgba(108,60,224,0.4);
        }
        .play-btn:hover {
            transform: scale(1.05);
            background: #7c4cf0;
        }
        .play-btn:active { transform: scale(0.95); }
        .volume-control {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 10px;
        }
        .volume-icon {
            font-size: 16px;
            cursor: pointer;
            opacity: 0.7;
        }
        .volume-slider {
            flex: 1;
            -webkit-appearance: none;
            appearance: none;
            height: 4px;
            border-radius: 2px;
            background: rgba(255,255,255,0.2);
            outline: none;
        }
        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #6c3ce0;
            cursor: pointer;
        }
        .listeners-count {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            margin-top: 15px;
        }
        .error-msg {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="player-container">
        <div class="player-card">
            <div class="cover-art" id="coverArt">&#x1F3B5;</div>
            <div class="station-name" id="stationName">Cargando...</div>
            <div class="now-playing" id="nowPlaying">-</div>
            <div class="artist" id="artistName">-</div>
            <div class="status-indicator">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">Conectando...</span>
            </div>
            <div class="controls">
                <button class="play-btn" id="playBtn" onclick="togglePlay()">&#x25B6;</button>
            </div>
            <div class="volume-control">
                <span class="volume-icon" onclick="toggleMute()">&#x1F50A;</span>
                <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="80" oninput="setVolume(this.value)">
            </div>
            <div class="listeners-count" id="listenersCount"></div>
            <div class="error-msg" id="errorMsg"></div>
        </div>
    </div>

    <script>
    (function() {
        const params = new URLSearchParams(window.location.search);
        const slug = params.get('station') || params.get('slug') || '';
        const apiBase = params.get('api') || '';

        let audio = null;
        let isPlaying = false;
        let streamUrl = '';
        let refreshInterval = null;

        function init() {
            if (!slug) {
                showError('Parámetro "station" requerido');
                return;
            }
            if (!apiBase) {
                showError('Parámetro "api" requerido');
                return;
            }
            fetchData();
            refreshInterval = setInterval(fetchData, 15000);
        }

        function fetchData() {
            fetch(apiBase + '/api/nowplaying.php?slug=' + encodeURIComponent(slug))
                .then(r => r.json())
                .then(data => {
                    if (data.error) {
                        showError(data.error);
                        return;
                    }
                    document.getElementById('stationName').textContent = data.station.name;
                    streamUrl = data.station.stream_url;

                    if (data.live.online) {
                        document.getElementById('statusDot').className = 'status-dot online';
                        document.getElementById('statusText').textContent = 'EN VIVO';
                    } else {
                        document.getElementById('statusDot').className = 'status-dot';
                        document.getElementById('statusText').textContent = 'OFFLINE';
                    }

                    if (data.now_playing) {
                        document.getElementById('nowPlaying').textContent = data.now_playing.title || '-';
                        document.getElementById('artistName').textContent = data.now_playing.artist || '-';
                        if (data.now_playing.cover) {
                            document.getElementById('coverArt').innerHTML = '<img src="' + data.now_playing.cover + '" alt="cover">';
                        }
                    } else if (data.live.title) {
                        document.getElementById('nowPlaying').textContent = data.live.title;
                    }

                    if (data.live.listeners !== undefined) {
                        document.getElementById('listenersCount').textContent = data.live.listeners + ' oyente' + (data.live.listeners !== 1 ? 's' : '');
                    }

                    document.title = (data.now_playing?.title || data.station.name) + ' - Radio Player';
                })
                .catch(err => {
                    console.error('API error:', err);
                });
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.style.display = 'block';
        }

        window.togglePlay = function() {
            if (!streamUrl) return;
            if (isPlaying) {
                audio.pause();
                audio.src = '';
                audio = null;
                isPlaying = false;
                document.getElementById('playBtn').innerHTML = '&#x25B6;';
            } else {
                audio = new Audio(streamUrl);
                audio.volume = document.getElementById('volumeSlider').value / 100;
                audio.play().catch(err => showError('Error al reproducir'));
                isPlaying = true;
                document.getElementById('playBtn').innerHTML = '&#x23F8;';

                audio.addEventListener('error', function() {
                    showError('Error de conexión al stream');
                    isPlaying = false;
                    document.getElementById('playBtn').innerHTML = '&#x25B6;';
                });
            }
        };

        window.setVolume = function(val) {
            if (audio) audio.volume = val / 100;
        };

        window.toggleMute = function() {
            const slider = document.getElementById('volumeSlider');
            if (audio) {
                if (audio.volume > 0) {
                    audio._prevVol = audio.volume;
                    audio.volume = 0;
                    slider.value = 0;
                } else {
                    audio.volume = audio._prevVol || 0.8;
                    slider.value = audio.volume * 100;
                }
            }
        };

        init();
    })();
    </script>
</body>
</html>
